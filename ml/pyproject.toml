[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pacfan-ml"
version = "0.1.0"
description = "Gymnasium environment, baselines, and RL trainers for headless pacfan"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
train = [
    "torch>=2.2",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "tensorboard>=2.16",
]

[tool.setuptools]
py-modules = ["pacfan_env", "baselines", "train_ppo", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
